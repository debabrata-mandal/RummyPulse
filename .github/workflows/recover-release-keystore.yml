name: Recover encrypted release keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Write one-time recovery public key
        run: |
          cat > recovery-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAr7Oi9dqBh8wVngaPgn6k
          XxuFQYO8Q3XU28JuV7QuOvSvb5fvXbqSlDxBELFYz0Hl2uDH1qvA3zYrgTZmJaCT
          D6XInWphwhBkerVKuKmFapP6sHZnDNkL9DxmE2879ycXZGsy1+TiCSWwfQfCL8Do
          OUvJu11wgYH7XvBhDImfPvIMbRexVFULpu/71Gf57JpVh1+Q5SwYXtLKHvs2DZKq
          F5T6V8au9XYXITqZzqgDLLL8FJC9BsIOsPlF7ZCAYtxdrI6xMHS5CIlkcWhHZIM1
          Vj2czK4217szJioQ5+bqISCTdUMHfxFalx95J6tYfBPSp/rpCCB2M5nFUD+JAPfo
          wrKvUYFawDWPyPf3wGGy4IJ0rAsa5z+QKoTptyDS1j82BA8gXj917itznjf7bTlI
          Q4LcSineMca5gNAEwjwiB22Jng2yrk1toWknIxCLi4zfRHxf+B17Y+wy1Qa8WBMn
          lRL2uVYRvtRPoWI7aeJ+W49OcUuVVItpSwmcAkcqB8VgZ6XFcXpF8DiVibVa4c8U
          1zA6tZEndslIBFSoTHWxSj0eGNg8zE9SlA2o6tK05Fs7Rj1dzMKO2bUA82iy3LnP
          MpzFzmQ3/80gzFUiW6MNysfThPt03oKRSz0v9BCAQc7Zn+QcWiI10TffUQ/I+1bQ
          KjF0y1mX00+Z6xVtHlwMLlUCAwEAAQ==
          -----END PUBLIC KEY-----
          EOF

      - name: Encrypt release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          sha256sum release.keystore | cut -d' ' -f1 > release.keystore.sha256
          mkdir chunks encrypted
          split -b 446 -d -a 6 release.keystore chunks/part-
          for part in chunks/part-*; do
            openssl pkeyutl -encrypt \
              -pubin \
              -inkey recovery-public.pem \
              -in "$part" \
              -out "encrypted/$(basename "$part").rsa" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256
          done
          cat encrypted/*.rsa > release.keystore.rsa
          test -s release.keystore.rsa
          shred -u release.keystore
          rm -rf chunks encrypted recovery-public.pem

      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-release-keystore
          path: |
            release.keystore.rsa
            release.keystore.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary files
        if: always()
        run: |
          shred -u release.keystore 2>/dev/null || true
          rm -rf chunks encrypted recovery-public.pem
